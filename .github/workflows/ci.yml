name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install ruff fast-flights

      - name: Lint Python
        run: |
          ruff check fly-smart/references/flight-transfer-finder.py || true

      - name: Validate SKILL.md YAML frontmatter
        run: |
          python3 -c "
          import re, sys
          with open('fly-smart/SKILL.md') as f:
              content = f.read()
          # Parse frontmatter without pyyaml
          m = re.match(r'^---\s*\n(.*?)\n---\s*\n', content, re.DOTALL)
          if not m:
              print('SKILL.md missing YAML frontmatter')
              sys.exit(1)
          front = m.group(1)
          keys = [line.split(':')[0].strip() for line in front.split('\n') if ':' in line]
          required = ['name', 'description', 'license']
          missing = [k for k in required if k not in keys]
          if missing:
              print(f'Missing frontmatter keys: {missing}')
              sys.exit(1)
          name_m = re.search(r'^name:\s*(.+?)\s*$', front, re.MULTILINE)
          ver_m = re.search(r'^version:\s*[\"\']?(.+?)[\"\']?\s*$', front, re.MULTILINE)
          print(f'✅ SKILL.md valid — name: {name_m.group(1) if name_m else \"?\"}, version: {ver_m.group(1) if ver_m else \"?\"}')
          "

      - name: Smoke test — script --help
        run: |
          python3 fly-smart/references/flight-transfer-finder.py --help 2>&1 | head -5

      - name: Smoke test — direct-only quick route
        run: |
          timeout 30 python3 fly-smart/references/flight-transfer-finder.py \
            -o LAX -d SFO -dt 2026-07-01 --direct-only --no-cache 2>&1 | tail -5 || \
          echo "Smoke test (network-dependent — failure here is expected in sandboxed CI)"
