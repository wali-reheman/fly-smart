[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fly-smart"
version = "1.2.0"
description = "Find cheaper flight routes using hidden-city arbitrage — no API key required"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Wali Reheman", email = "wali@nju.edu.cn"}
]
keywords = ["flights", "travel", "hidden-city", "self-transfer", "budget-travel", "google-flights"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
]
requires-python = ">=3.10"
dependencies = [
    "fast-flights>=1.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
    "pytest>=7.0",
]

[project.scripts]
fly-smart = "fly_smart.cli:main"

[project.urls]
Homepage = "https://github.com/wali-reheman/fly-smart"
Documentation = "https://github.com/wali-reheman/fly-smart#readme"
Repository = "https://github.com/wali-reheman/fly-smart"
Issues = "https://github.com/wali-reheman/fly-smart/issues"

[tool.setuptools]
packages = ["fly_smart"]
package-dir = {"" = "fly_smart"}

[tool.ruff]
line-length = 100
target-version = "py310"
